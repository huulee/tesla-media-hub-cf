name = "tesla-media-hub"
main = "src/index.js"
compatibility_date = "2025-05-01"

# 你的 Cloudflare 账号 ID（Git 集成部署时可不填，由后台所选账号决定；本地 wrangler dev/deploy 需要）
# 获取方式：Cloudflare 后台右上角「账户 ID」，或执行 `npx wrangler whoami`
account_id = "REPLACE_WITH_YOUR_ACCOUNT_ID"

# 静态资源（前端 public/）由 Cloudflare 静态资产直接托管，无需 /api 的请求会回退到这里
[assets]
directory = "./public"
binding = "ASSETS"
# hash 路由，未匹配文件回退到 index.html（无害，主要用于直接深链）
not_found_handling = "single-page-application"

# 持久化：源配置 / 管理员账号 存到 KV（替代原 Docker 的 data/ 磁盘卷）
[[kv_namespaces]]
binding = "TMH_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

[vars]
# 首次部署的默认管理员账号（部署后仍可在管理后台网页修改，修改后写入 KV 覆盖此处）
ADMIN_USER = "admin"
ADMIN_PASS = "admin123"

# 重要：登录态签名密钥请通过 Secrets 设置（不写进仓库）：
#   npx wrangler secret put TMH_SECRET
# 不设置时 worker 会在每次冷启动随机生成一个密钥，登录在重启后失效（仅适合快速试跑）。
